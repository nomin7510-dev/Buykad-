<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liquid glass background + Flower fireworks</title>
<style>
  :root{
    --bg1:#0f1724;
    --bg2:#3b1f47;
  }
  html,body{height:100%;margin:0;}
  body{
    background: linear-gradient(120deg,var(--bg1),var(--bg2));
    overflow:hidden;
    font-family:system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* floating soft blobs */
  .blob{
    position:fixed;
    width:40vmax;height:40vmax;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.45;
    mix-blend-mode:screen;
    transform-origin:center;
    animation:float 12s ease-in-out infinite;
    pointer-events:none;
  }
  .blob.b1{left:-10vmax;top:-8vmax;background:radial-gradient(circle at 30% 30%, #ff7ab6 0%, transparent 40%);}
  .blob.b2{right:-12vmax;bottom:-6vmax;background:radial-gradient(circle at 70% 70%, #7afcff 0%, transparent 40%); animation-duration:18s;}
  .blob.b3{left:20vmax;bottom:10vmax;background:radial-gradient(circle at 60% 40%, #ffd36b 0%, transparent 40%); animation-duration:16s;}

  @keyframes float{
    0%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-5vh) scale(1.03)}
    100%{transform:translateY(0) scale(1)}
  }

  /* Glass overlay */
  #glass{
    position:fixed;
    inset:0;
    pointer-events:none;
  }
  .glass-panel{
    position:absolute;
    inset:6vmin;
    border-radius:20px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    border:1px solid rgba(255,255,255,0.06);
    box-shadow: 0 10px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    overflow:hidden;
  }

  /* Canvas for fireworks */
  #fx-canvas{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:auto;
    cursor:crosshair;
  }

  /* small instruction */
  .hint{
    position:fixed;left:1rem;bottom:1rem;color:rgba(255,255,255,0.85);z-index:10;
    background:rgba(0,0,0,0.25);padding:8px 10px;border-radius:8px;font-size:14px;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- Glass + SVG filter for displacement -->
  <div id="glass" aria-hidden="true">
    <!-- SVG filter covers whole page; JS will animate baseFrequency -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <filter id="liquid">
          <feTurbulence id="turb" baseFrequency="0.01 0.02" numOctaves="3" seed="2" stitchTiles="noStitch" type="fractalNoise" />
          <feDisplacementMap id="disp" in="SourceGraphic" scale="25" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <!-- The glass panel to which the SVG filter is applied -->
    <div class="glass-panel" style="filter:url(#liquid)"></div>
  </div>

  <!-- fireworks canvas -->
  <canvas id="fx-canvas"></canvas>

  <div class="hint">Click or tap to launch flower-fireworks • Resize to see effect</div>

<script>
/* ---------- Liquid animation: tweak feTurbulence.baseFrequency & feDisplacementMap.scale ---------- */
(() => {
  const turb = document.getElementById('turb');
  const disp = document.getElementById('disp');
  let t = 0;
  function animateLiquid(){
    t += 0.016;
    // oscillate baseFrequency to create flowing waves
    const bfX = 0.008 + Math.sin(t*0.6)*0.004 + Math.cos(t*0.2)*0.002;
    const bfY = 0.012 + Math.cos(t*0.5)*0.003;
    turb.setAttribute('baseFrequency', `${bfX} ${bfY}`);
    // optional: slightly modulate displacement scale
    const scale = 20 + Math.sin(t*0.9)*6;
    disp.setAttribute('scale', Math.abs(scale));
    requestAnimationFrame(animateLiquid);
  }
  animateLiquid();
})();

/* ---------- Fireworks: canvas particle system drawing petal-like particles ---------- */
(() => {
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  let W = canvas.width = innerWidth;
  let H = canvas.height = innerHeight;
  window.addEventListener('resize', ()=> { W = canvas.width = innerWidth; H = canvas.height = innerHeight; });

  // helpers
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function hsla(h,s,l,a){ return `hsla(${h},${s}%,${l}%,${a})`; }

  // create small petal image on offscreen canvas to speed drawing
  function makePetal(size, colorH){
    const c = document.createElement('canvas');
    const s = Math.ceil(size*1.2);
    c.width = c.height = s;
    const g = c.getContext('2d');
    g.translate(s/2, s/2);
    // draw a petal using quadratic curves
    g.fillStyle = colorH;
    g.beginPath();
    g.moveTo(0,0);
    g.quadraticCurveTo(size*0.6, -size*0.2, size*0.2, -size*0.8);
    g.quadraticCurveTo(0, -size*1.05, -size*0.2, -size*0.8);
    g.quadraticCurveTo(-size*0.6, -size*0.2, 0,0);
    g.closePath();
    const grad = g.createLinearGradient(0,-size,0,size);
    grad.addColorStop(0, "rgba(255,255,255,0.9)");
    grad.addColorStop(0.2, colorH);
    grad.addColorStop(1, "rgba(0,0,0,0.05)");
    g.fillStyle = grad;
    g.fill();
    return c;
  }

  class Particle {
    constructor(x,y,hue, speed, angle, petalCanvas){
      this.x = x; this.y = y;
      this.vx = Math.cos(angle)*speed;
      this.vy = Math.sin(angle)*speed;
      this.life = 0;
      this.ttl = rand(50,120); // frames
      this.size = rand(6,18);
      this.hue = hue + rand(-10,10);
      this.rot = rand(0,Math.PI*2);
      this.omega = rand(-0.2,0.2);
      this.petal = petalCanvas;
      this.alpha = 1;
      this.spin = rand(-0.2,0.2);
    }
    update(){
      this.vy += 0.06; // gravity
      this.vx *= 0.995; this.vy *= 0.995; // slight air
      this.x += this.vx; this.y += this.vy;
      this.rot += this.omega;
      this.life++;
      // fade out
      const t = this.life / this.ttl;
      this.alpha = Math.max(0, 1 - t);
    }
    draw(ctx){
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      const s = this.size / (this.petal.width/1.2);
      ctx.drawImage(this.petal, -this.petal.width/2, -this.petal.height/2, this.petal.width*s, this.petal.height*s);
      ctx.restore();
    }
  }

  const particles = [];
  function explode(x,y, hue, count){
    // pre-create several petal images at different sizes for variety
    for(let i=0;i<count;i++){
      const ang = rand(0, Math.PI*2);
      const sp = rand(2.6, 6.6);
      const petal = makePetal(rand(10,26), hsla(hue + rand(-20,20), 80, 55, 1));
      particles.push(new Particle(x,y, hue, sp, ang, petal));
    }
  }

  // optional: launching - rise and explode
  function launchAndExplode(x, baseHue){
    // choose target height
    const tx = x;
    const ty = rand(H*0.12, H*0.45);
    // animate a trail up to target then explode
    const steps = 30;
    let step = 0;
    const sx = rand(0.1,0.9) < 0.5 ? x : x + rand(-80,80);
    const sy = H + 10;
    const interval = setInterval(()=>{
      // small trail particles along path
      const t = step/steps;
      const cx = sx + (tx - sx)*t;
      const cy = sy + (ty - sy)*t;
      // create tiny spark trail
      const pet = makePetal(rand(4,8), hsla(baseHue,90,60,1));
      particles.push(new Particle(cx,cy, baseHue, rand(0.6,1.6), rand(0,Math.PI*2), pet));
      step++;
      if(step>steps){
        clearInterval(interval);
        explode(tx,ty, baseHue, Math.floor(rand(40,120)));
      }
    }, 18);
  }

  // spawn random ambient fireworks
  setInterval(()=>{
    // less frequent on small screens
    if(Math.random() < 0.6) return;
    const x = rand(W*0.1, W*0.9);
    const hue = Math.floor(rand(0,360));
    launchAndExplode(x, hue);
  }, 900);

  // user click/tap to explode more spectacular
  canvas.addEventListener('pointerdown', (e)=>{
    const x = e.clientX;
    const hue = Math.floor(rand(0,360));
    launchAndExplode(x, hue);
  });

  // main loop
  function loop(){
    // translucent clear for trails
    ctx.fillStyle = 'rgba(5,8,12,0.22)';
    ctx.fillRect(0,0,W,H);

    // update and draw particles
    for(let i = particles.length-1; i>=0; i--){
      const p = particles[i];
      p.update();
      p.draw(ctx);
      if(p.life > p.ttl || p.alpha <= 0.01 || p.x < -50 || p.x > W+50 || p.y > H+50){
        particles.splice(i,1);
      }
    }
    requestAnimationFrame(loop);
  }
  // init background clear so first frame not black
  ctx.fillStyle = 'rgba(5,8,12,1)';
  ctx.fillRect(0,0,W,H);
  loop();
})();
</script>
</body>
</html>
